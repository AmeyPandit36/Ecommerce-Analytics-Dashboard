# Render Blueprint — https://dashboard.render.com/blueprints
# "New +" → Blueprint → point it at this repo. Everything below is declarative, so
# there is nothing to fill in on the Render screens.
services:
  - type: web
    name: ecommerce-analytics-dashboard
    runtime: python
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /healthz
    buildCommand: pip install -r requirements.txt gunicorn
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: WEB_CONCURRENCY
        value: "2"
